<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  var el = btn.querySelector('.taiji');
  if (!el) return;
  
  var storedRot = '0';
  try { storedRot = localStorage.getItem('taiji-rot') || '0'; } catch(e) {}
  var rot = (Math.round((parseInt(storedRot, 10) || 0) / 180) % 2) * 180;
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if ((rot === 180) !== dark) { rot = rot === 0 ? 180 : 0; }
  
  el.style.transition = 'none';
  el.style.transform = 'rotate(' + rot + 'deg)';
  void el.offsetWidth; 
  el.style.transition = '';
  try { localStorage.setItem('taiji-rot', String(rot)); } catch(e) {}
  btn.addEventListener('click', function(){
    rot += 180; 
    el.style.transform = 'rotate(' + rot + 'deg)';
    try { localStorage.setItem('taiji-rot', String(rot)); } catch(e) {}
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('theme', cur); } catch(e) {}
  });
})();
</script>
